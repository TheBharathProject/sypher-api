name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/sypher-api

jobs:
  # ————————————————————————————————————————————————
  # Always run on PRs and main: lint + import-check + amd64 build
  # (cheap sanity check; doesn't push)
  # ————————————————————————————————————————————————
  lint-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff

      - name: Lint
        run: ruff check app/

      - name: Import-check (catches obvious wiring bugs)
        env:
          DATABASE_URL: postgresql://x:y@127.0.0.1:5432/z
          WAITLIST_API_KEY: ci-test
          IP_SALT: ci-test
        run: python -c "from app.main import app; print('imports ok:', app.title)"

      - name: Docker build (amd64 only — fast smoke check)
        run: docker build -t sypher-api:ci .

  # ————————————————————————————————————————————————
  # Only on push to main: build multi-arch (amd64 + arm64) and publish
  # to GHCR. The OCI VM is arm64, so arm64 is required.
  # ————————————————————————————————————————————————
  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: lint-and-build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-

      - name: Build and push (amd64 + arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
