name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff

      - name: Lint
        run: ruff check app/

      - name: Import-check (catches obvious wiring bugs)
        env:
          DATABASE_URL: postgresql://x:y@127.0.0.1:5432/z
          WAITLIST_API_KEY: ci-test
          IP_SALT: ci-test
        run: python -c "from app.main import app; print('imports ok:', app.title)"

      - name: Docker build
        run: docker build -t sypher-api:ci .
